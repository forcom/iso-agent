name = "iso-agent"
main = "src/entry.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "iso-agent"
LLM_MODEL = "gpt-4.1-mini"
ENGINE_URL = "http://127.0.0.1:8788"
ALLOW_FICTIONAL_PERSONNEL = "true"
RESEARCH_SCHEDULES_ENABLED = "false"

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "../../output/build/worker/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/oauth/*", "/.well-known/*"]

[[d1_databases]]
binding = "DB"
database_name = "iso-agent-erp-local"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SOURCES"
bucket_name = "iso-agent-erp-sources"
