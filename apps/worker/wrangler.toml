name = "iso-agent-demo"
account_id = "e3795b9711f462af967e2b8b97be2f4b"
workers_dev = true
main = "src/entry.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "iso-agent"
LLM_MODEL = "gpt-4.1-mini"
ALLOW_FICTIONAL_PERSONNEL = "true"

[assets]
directory = "../../output/build/worker/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "iso-agent-demo"
database_id = "1bd6a3bd-d94d-4f06-828e-93438387625e"
migrations_dir = "migrations"
remote = true

[[r2_buckets]]
binding = "SOURCES"
bucket_name = "iso-agent-demo-sources"
remote = true

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "PyreWireEngine"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PyreWireEngine"]

[[containers]]
class_name = "PyreWireEngine"
image = "../engine/Dockerfile"
image_build_context = "../.."
max_instances = 1
